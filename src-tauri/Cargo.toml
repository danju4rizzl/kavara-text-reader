[package]
name = "kavara-text-to-voice"
version = "0.1.0"
description = "Kavara Text to Voice — Floating always-on-top Windows text-to-speech reader"
authors = ["Kavara"]
edition = "2021"

[lib]
name = "kavara_text_to_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tts = "0.26"
enigo = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
